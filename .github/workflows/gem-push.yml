name: Ruby Gem

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler: none

    - name: Build gem
      run: gem build *.gemspec

    - name: Publish to RubyGems
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        VERSION=$(ruby -r ./lib/ntq_excelsior/version.rb -e 'puts NtqExcelsior::VERSION')
        # `gem info -v X --remote` exits 0 even when X does not exist: ask the API instead (404 = not published)
        if curl -fs -o /dev/null "https://rubygems.org/api/v2/rubygems/ntq_excelsior/versions/${VERSION}.json"; then
          echo "Version $VERSION is already published on RubyGems, skipping push."
          exit 0
        fi

        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem push *.gem
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_AUTH_TOKEN}}"
